name: ci

on:
  pull_request:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The GPU image is about 11 GB. Remove the toolchains that this workflow does not use.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Get the release version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo VERSION=${GITHUB_REF/refs\/tags\//} >> $GITHUB_ENV
            echo LATEST=true >> $GITHUB_ENV
          else
            echo VERSION=dev >> $GITHUB_ENV
            echo LATEST=false >> $GITHUB_ENV
          fi

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Builds base-cpu, cpu-analytics and ai-ml-gpu in parent order. Pushes on release only.
      - name: Build kernel images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
